<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250" viewBox="0 0 800 250">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;800&amp;display=swap');
      
      .bg {
        fill: #020617; /* Very dark blue/black slate */
      }
      
      /* Floating Aurora Orbs */
      .orb {
        filter: url(#blur-filter);
        animation: float 25s ease-in-out infinite alternate;
      }
      .orb-1 { fill: #9333ea; animation-delay: 0s; animation-duration: 25s; } /* Purple */
      .orb-2 { fill: #06b6d4; animation-delay: -5s; animation-duration: 30s; } /* Cyan */
      .orb-3 { fill: #4f46e5; animation-delay: -15s; animation-duration: 22s; } /* Indigo */
      .orb-4 { fill: #38bdf8; animation-delay: -10s; animation-duration: 28s; } /* Sky Blue */
      
      @keyframes float {
        0% { transform: translate(0, 0) scale(1); }
        33% { transform: translate(150px, -50px) scale(1.2); }
        66% { transform: translate(-100px, 100px) scale(0.9); }
        100% { transform: translate(-50px, -150px) scale(1.1); }
      }
      
      /* Typography */
      .title {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 64px;
        font-weight: 800;
        fill: url(#text-grad);
        text-anchor: middle;
        letter-spacing: -1px;
        animation: fadeUp 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      
      .subtitle {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 18px;
        font-weight: 500;
        fill: #e2e8f0;
        text-anchor: middle;
        letter-spacing: 0.5px;
        opacity: 0;
        animation: fadeUp 2s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
      }
      
      .dot {
        fill: #38bdf8;
        font-size: 22px;
        animation: pulseDot 2s ease-in-out infinite alternate;
      }
      
      @keyframes pulseDot {
        0% { opacity: 0.4; }
        100% { opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
      }
      
      @keyframes fadeUp {
        0% { opacity: 0; transform: translateY(20px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      /* Floating Ambient Stars / Dust */
      .star {
        fill: #ffffff;
        animation: twinkle 4s infinite alternate;
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.1; transform: scale(0.6); }
        50% { opacity: 0.8; transform: scale(1.2); filter: drop-shadow(0 0 3px #fff); }
      }

      /* Slow rotating geometric decoration */
      .geo {
        fill: none;
        stroke: rgba(255, 255, 255, 0.05);
        stroke-width: 1;
        animation: spin 40s linear infinite;
        transform-origin: center;
      }
      @keyframes spin {
        100% { transform: rotate(360deg); }
      }
    </style>
    
    <!-- Extreme Blur for Aurora Effect -->
    <filter id="blur-filter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55" />
    </filter>
    
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <clipPath id="round-corner">
      <rect x="0" y="0" width="800" height="250" rx="32" />
    </clipPath>
  </defs>

  <g clip-path="url(#round-corner)">
  <!-- Solid Background -->
  <rect width="100%" height="100%" class="bg" rx="32" />
  
  <!-- Aurora Orbs Background -->
  <g opacity="0.65">
    <circle cx="150" cy="50" r="130" class="orb orb-1" />
    <circle cx="650" cy="220" r="140" class="orb orb-2" />
    <circle cx="700" cy="-20" r="110" class="orb orb-3" />
    <circle cx="100" cy="260" r="120" class="orb orb-4" />
    <circle cx="400" cy="125" r="150" class="orb orb-3" style="animation-duration: 35s; opacity: 0.5;" />
  </g>
  
  <!-- Abstract Geometric overlay (barely visible) -->
  <circle cx="400" cy="125" r="300" class="geo" stroke-dasharray="2 10" />
  <circle cx="400" cy="125" r="250" class="geo" stroke-dasharray="20 40" style="animation-direction: reverse; animation-duration: 60s;" />

  <!-- Twinkling Stars / Dust Particles -->
  <circle cx="80" cy="150" r="2" class="star" style="animation-delay: 0s; animation-duration: 3s;" />
  <circle cx="250" cy="60" r="1.5" class="star" style="animation-delay: 1s; animation-duration: 4s;" />
  <circle cx="650" cy="120" r="2.5" class="star" style="animation-delay: 2s; animation-duration: 5s;" />
  <circle cx="720" cy="200" r="1" class="star" style="animation-delay: 0.5s; animation-duration: 3.5s;" />
  <circle cx="150" cy="220" r="2" class="star" style="animation-delay: 1.5s; animation-duration: 2s;" />
  <circle cx="420" cy="40" r="1.5" class="star" style="animation-delay: 0.2s; animation-duration: 4.5s;" />
  <circle cx="580" cy="230" r="2" class="star" style="animation-delay: 2.5s; animation-duration: 3.2s;" />
  <circle cx="350" cy="180" r="1.5" class="star" style="animation-delay: 0.8s; animation-duration: 2.8s;" />

  <!-- Typography -->
  <g>
    <text x="400" y="130" class="title">Raihan Zaky</text>
    
    <text x="400" y="175" class="subtitle">
      Computer Science Student <tspan class="dot">•</tspan> Developer <tspan class="dot">•</tspan> Lab Assistant
    </text>
  </g>
  </g>
  
  <!-- Subtle glass border -->
  <rect width="100%" height="100%" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" rx="32" />
</svg>
