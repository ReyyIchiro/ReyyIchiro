<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250" viewBox="0 0 800 250">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&amp;family=Orbitron:wght@700;900&amp;display=swap');
      
      .bg-rect { fill: #0d1117; }
      
      .grid-line {
        stroke: #1e293b;
        stroke-width: 1.5;
      }
      
      .name {
        font-family: 'Orbitron', sans-serif;
        font-size: 64px;
        font-weight: 900;
        fill: #ffffff;
        text-anchor: middle;
        letter-spacing: 4px;
      }
      
      .name-glow {
        font-family: 'Orbitron', sans-serif;
        font-size: 64px;
        font-weight: 900;
        fill: #00e5ff;
        text-anchor: middle;
        letter-spacing: 4px;
        filter: url(#glow);
        animation: pulseGlow 2s infinite alternate;
      }
      
      @keyframes pulseGlow {
        0% { opacity: 0.3; }
        100% { opacity: 0.8; }
      }
      
      .subtitle {
        font-family: 'Fira Code', monospace;
        font-size: 17px;
        fill: #38bdf8;
        text-anchor: middle;
        letter-spacing: 1px;
      }
      
      .cursor {
        fill: #00e5ff;
        animation: blink 1s step-end infinite;
      }
      @keyframes blink { 50% { opacity: 0; } }
      
      .circuit {
        stroke: #00e5ff;
        stroke-width: 2.5;
        fill: none;
        stroke-dasharray: 400;
        stroke-dashoffset: 400;
        animation: drawCircuit 4s ease-in-out infinite alternate;
      }
      @keyframes drawCircuit {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      
      .node {
        fill: #3b82f6;
        animation: pulseNode 2s infinite alternate;
      }
      @keyframes pulseNode {
        0% { r: 3; opacity: 0.5; }
        100% { r: 6; opacity: 1; fill: #00e5ff; }
      }
      
      .bracket {
        fill: #475569;
        font-family: 'Fira Code', monospace;
        font-size: 24px;
        font-weight: bold;
      }
      
      .code-bg {
        font-family: 'Fira Code', monospace;
        font-size: 11px;
        fill: #1e293b;
        opacity: 0.6;
        animation: scrollUp 25s linear infinite;
      }
      @keyframes scrollUp {
        0% { transform: translateY(0); }
        100% { transform: translateY(-100px); }
      }
    </style>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" class="grid-line"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg-rect" rx="8" />
  
  <!-- Grid -->
  <rect width="100%" height="100%" fill="url(#gridPattern)" rx="8" opacity="0.6"/>

  <!-- Code Background Matrix-style -->
  <g class="code-bg">
    <text x="50" y="50">const profile = new Developer("Raihan");</text>
    <text x="600" y="90">import { ML } from 'tensorflow';</text>
    <text x="100" y="200">docker-compose up -d --build</text>
    <text x="620" y="220">while(coffee) { keepCoding(); }</text>
    <text x="40" y="150">SELECT * FROM side_projects;</text>
    <text x="520" y="40">System.out.println("Hello World!"); </text>
    
    <text x="50" y="150">const profile = new Developer("Raihan");</text>
    <text x="600" y="190">import { ML } from 'tensorflow';</text>
    <text x="100" y="300">docker-compose up -d --build</text>
    <text x="620" y="320">while(coffee) { keepCoding(); }</text>
    <text x="40" y="250">SELECT * FROM side_projects;</text>
    <text x="520" y="140">System.out.println("Hello World!"); </text>
  </g>

  <!-- Circuit Lines Left -->
  <path class="circuit" d="M -20 125 L 50 125 L 80 95 L 150 95 L 180 125 L 220 125" />
  <circle cx="220" cy="125" r="4" class="node" />
  <circle cx="150" cy="95" r="3" class="node" style="animation-delay: 0.5s;" />

  <!-- Circuit Lines Right -->
  <path class="circuit" d="M 820 125 L 750 125 L 720 155 L 650 155 L 620 125 L 580 125" />
  <circle cx="580" cy="125" r="4" class="node" />
  <circle cx="650" cy="155" r="3" class="node" style="animation-delay: 1s;" />

  <!-- Main Text -->
  <g transform="translate(0, 10)">
    <!-- Glowing shadow layer -->
    <text x="400" y="125" class="name-glow">RAIHAN ZAKY</text>
    <!-- Sharp crisp top layer -->
    <text x="400" y="125" class="name">RAIHAN ZAKY</text>
    
    <!-- Subtitle -->
    <text x="400" y="165" class="subtitle">
      <tspan class="bracket">&lt;</tspan>
      Computer Science Student <tspan fill="#475569">|</tspan> Developer <tspan fill="#475569">|</tspan> Lab Assistant 
      <tspan class="bracket">/&gt;</tspan><tspan class="cursor">_</tspan>
    </text>
  </g>
</svg>
