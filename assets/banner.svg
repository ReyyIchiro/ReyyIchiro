<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240" role="img" aria-labelledby="title desc">
  <title id="title">Raihan Zaky</title>
  <desc id="desc">Computer Science Student, Software and Web Developer, Lab Assistant</desc>

  <defs>
    <clipPath id="card">
      <rect width="800" height="240" rx="24" />
    </clipPath>

    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.055" />
    </pattern>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4c3bcf" stop-opacity="0.42" />
      <stop offset="65%" stop-color="#4c3bcf" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#4c3bcf" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="warm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7a45" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ff7a45" stop-opacity="0" />
    </radialGradient>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>

  <g clip-path="url(#card)">
    <rect width="800" height="240" fill="#14161c" />
    <rect width="800" height="240" fill="url(#dots)" />

    <circle cx="650" cy="120" r="190" fill="url(#glow)" />
    <circle cx="520" cy="245" r="130" fill="url(#warm)" />

    <!-- radial gauge -->
    <g fill="none">
      <circle cx="650" cy="120" r="40" stroke="#2a2e3a" stroke-width="1" />
      <circle cx="650" cy="120" r="72" stroke="#2a2e3a" stroke-width="1" />
      <circle cx="650" cy="120" r="104" stroke="#2a2e3a" stroke-width="1" />

      <circle cx="650" cy="120" r="116" stroke="#343a49" stroke-width="6"
              stroke-dasharray="1.2 13.98" opacity="0.65" />

      <g>
        <animateTransform attributeName="transform" type="rotate"
                          from="0 650 120" to="360 650 120"
                          dur="36s" repeatCount="indefinite" />
        <path d="M 590.35 34.80 A 104 104 0 0 1 750.50 93.08"
              stroke="#7c6fff" stroke-width="2.5" stroke-linecap="round" />
        <path d="M 590.35 34.80 A 104 104 0 0 1 670.90 32.32"
              stroke="#7c6fff" stroke-width="2.5" stroke-linecap="round" opacity="0.22" />
        <circle cx="750.50" cy="93.08" r="4.5" fill="#ff9166" />
        <circle cx="750.50" cy="93.08" r="11" fill="#ff7a45" opacity="0.28" filter="url(#soft)" />
      </g>

      <circle cx="650" cy="120" r="7" stroke="#4c3bcf" stroke-width="1.5" opacity="0.55" />
      <circle cx="650" cy="120" r="3" fill="#ff9166" />
    </g>

    <!-- identity -->
    <text x="56" y="76" fill="#ff9166" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="500" letter-spacing="0.4">~/raihan</text>
    <text x="56" y="136" fill="#f4f6fa" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-1.5">Raihan Zaky</text>
    <text x="56" y="172" fill="#a7aebc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" letter-spacing="0.1">Computer Science Student <tspan fill="#ff9166">·</tspan> Developer <tspan fill="#ff9166">·</tspan> Lab Assistant</text>
  </g>

  <rect x="0.75" y="0.75" width="798.5" height="238.5" rx="23.25"
        fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" />
</svg>
